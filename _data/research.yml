# The lab's two research themes. Edit copy directly here — it drives both
# the homepage theme cards and the full sections on /research/.
#
# subthemes (maturation only) are short labels, not full sections.

- id: maturation
  slug: maturation
  title: Cardiomyocyte Maturation
  image: /assets/images/research/research-maturation.jpg
  image_alt: "[PLACEHOLDER] Microscopy image representing cardiomyocyte maturation"
  home_summary: >-
    We study how human pluripotent stem cell-derived
    cardiomyocytes acquire the structural, metabolic, molecular, and
    functional features associated with maturation.
  research_summary: >-
    A major focus of the lab is understanding how stem
    cell-derived cardiomyocytes progress from an immature, fetal-like state
    toward the structural, metabolic, molecular, and functional properties
    of more mature cardiomyocytes. We use this process as a framework for asking
    which features of maturation are coupled to one another, which can be
    driven independently, and how maturation state relates to the cell's
    later proliferative capacity.
  subthemes:
    - Structural maturation
    - Metabolic maturation
    - Functional maturation
    - Molecular maturation
    - Cellular heterogeneity

- id: regeneration
  slug: regeneration
  title: Cardiomyocyte Proliferation & Regeneration
  image: /assets/images/research/research-regeneration.jpg
  image_alt: "[PLACEHOLDER] Microscopy image representing cardiomyocyte proliferation"
  home_summary: >-
    We study how cardiomyocyte maturation relates to the loss
    of proliferative competence, and whether proliferation can be
    reactivated in mature human cardiomyocytes.
  research_summary: >-
    As cardiomyocytes mature, they largely lose the ability to
    divide, a central barrier to human heart regeneration. The lab studies
    the relationship between maturation state and proliferative competence,
    with the goal of understanding whether and how mature human
    cardiomyocytes can be induced to re-enter the cell cycle. Part of this
    work involves carefully distinguishing genuine cardiomyocyte division
    from alternative outcomes such as multinucleation or polyploidization,
    which can resemble proliferation but do not increase cell number.
  subthemes: []
