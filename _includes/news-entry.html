{% comment %}
  Reusable news item. Param: item (one document from site.news).
{% endcomment %}
{% assign item = include.item %}

<article class="news-entry">
  <p class="news-entry__date">{{ item.date | date: "%B %-d, %Y" }}</p>
  <div class="news-entry__body">
    <h3 class="news-entry__title">
      {% if item.category %}<span class="news-entry__category">{{ item.category }}</span>{% endif %}
      <a href="{{ item.url | relative_url }}">{{ item.title }}</a>
    </h3>
    {% if item.description %}
    <p class="news-entry__description">{{ item.description }}</p>
    {% endif %}
  </div>
  <a class="news-entry__thumb-link" href="{{ item.url | relative_url }}">
    <img class="news-entry__thumb" src="{{ item.image | default: '/assets/images/news/news-placeholder.svg' | relative_url }}" alt="" loading="lazy">
  </a>
</article>
