<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
  <title id="title">News item image placeholder</title>
  <desc id="desc">Set an "image:" field in this news item's front matter to replace it</desc>
  <rect width="800" height="400" fill="#f2f2f0"/>
  <rect x="6" y="6" width="788" height="388" fill="none" stroke="#c9c9c5" stroke-width="3" stroke-dasharray="14 10"/>
  <g fill="none" stroke="#b7b7b2" stroke-width="2.5">
    <rect x="320" y="150" width="160" height="100" rx="6"/>
    <circle cx="360" cy="185" r="12"/>
    <path d="M320 235 L370 195 L410 220 L480 165"/>
  </g>
  <text x="400" y="300" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6b6b6b">REPLACE ME</text>
  <text x="400" y="326" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#8a8a86">add "image:" to this item's front matter</text>
</svg>
